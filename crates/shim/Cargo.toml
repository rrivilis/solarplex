[package]
name = "shim"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "solarplex-shim"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
libc = "0.2"
# Correctly parses strace's C-escaped quoted-string arguments in scout.rs --
# the previous `s.find('"')`-based extraction had no concept of `\"`/`\\`
# escaping and silently truncated any path containing an escaped quote.
nom = "7"
