[package]
name = "sidecar"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "solarplex-adapter"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
axum = { version = "0.7", features = ["macros"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
dashmap = { workspace = true }
sha2 = "0.10"
aho-corasick = "1"
yara-x = "0.12"
tlsh2 = { version = "1", features = ["diff"] }
libc = "0.2"

# Observability, Layer 1+2 -- same three deps, same version-pinning reasoning
# as crates/server/Cargo.toml (see metrics_route.rs there for the long form).
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
autometrics = { version = "3", features = ["metrics-0_24", "prometheus-exporter"] }
