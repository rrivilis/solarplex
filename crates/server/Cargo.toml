[package]
name = "server"
version = "0.1.0"
edition = "2021"

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "solarplex"
path = "src/main.rs"

[[bench]]
name = "server_benches"
harness = false

[dependencies]
protocol = { path = "../protocol" }
db       = { path = "../db" }
session  = { path = "../session" }
intent   = { path = "../intent" }
splx-ir  = { path = "../splx-ir" }
bumpalo = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
dashmap = { workspace = true }
arc-swap = { workspace = true }
axum = { version = "0.7", features = ["ws", "macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "json"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "timeout"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
openidconnect = { version = "3", features = ["reqwest"] }
sha2 = "0.10"
tlsh2 = { version = "1", features = ["diff"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"
