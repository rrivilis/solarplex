[package]
name    = "session"
version = "0.31.0"
edition = "2021"
license = "Apache-2.0"

# Zero runtime deps — this crate is purely functional.
# transition() is synchronous; no tokio, no axum, no sqlx.

[[bench]]
name    = "session_benches"
harness = false

[[example]]
name = "replay_bench"

[features]
dhat-heap = ["dep:dhat"]

[dependencies]
protocol   = { path = "../protocol" }
bitflags   = { workspace = true }
bumpalo    = { workspace = true }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
chrono     = { version = "0.4", features = ["serde"] }
thiserror  = "1"
tracing    = "0.1"
dhat       = { version = "0.3", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"
