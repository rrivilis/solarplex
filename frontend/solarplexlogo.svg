<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <!-- Washed gradients for the two halves -->
        <linearGradient id="indigoWash1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b0bec5" stop-opacity="0.1" />
            <stop offset="30%" stop-color="#9fa8da" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#5c6bc0" stop-opacity="1" />
        </linearGradient>
        
        <linearGradient id="indigoWash2" x1="100%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#7986cb" stop-opacity="0.9" />
            <stop offset="50%" stop-color="#5c6bc0" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#3949ab" stop-opacity="1" />
        </linearGradient>

        <!-- Center gradients for depth -->
        <radialGradient id="centerGrad1" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#c5cae9" stop-opacity="0.9" />
            <stop offset="60%" stop-color="#5c6bc0" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#3949ab" stop-opacity="0.9" />
        </radialGradient>
        
        <radialGradient id="centerGrad2" cx="70%" cy="70%" r="70%">
            <stop offset="0%" stop-color="#7986cb" stop-opacity="0.9" />
            <stop offset="60%" stop-color="#3d5afe" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#1a237e" stop-opacity="0.9" />
        </radialGradient>

        <!-- Drop shadow to emphasize the slice -->
        <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="10" dy="10" stdDeviation="8" flood-color="#1a237e" flood-opacity="0.25" />
        </filter>

        <!-- Reusable sunray -->
        <path id="ray" d="M 250 40 L 230 170 Q 250 210 270 170 Z" />

        <!-- 24 rays forming the sunburst -->
        <g id="sunRays">
            <use href="#ray" x="0" y="0" transform="rotate(0 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(15 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(30 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(45 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(60 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(75 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(90 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(105 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(120 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(135 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(150 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(165 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(180 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(195 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(210 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(225 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(240 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(255 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(270 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(285 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(300 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(315 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(330 250 250)" />
            <use href="#ray" x="0" y="0" transform="rotate(345 250 250)" />
        </g>

        <!-- Clip paths for the 45-degree diagonal slice -->
        <!-- Top-right half (above the y=x line) -->
        <clipPath id="topRightHalf">
            <path d="M0,0 L500,500 L0,500 Z" />
        </clipPath>
        
        <!-- Bottom-left half (below the y=x line) -->
        <clipPath id="bottomLeftHalf">
            <path d="M0,0 L0,500 L500,500 Z" />
        </clipPath>
    </defs>

    <!--background -->
    <rect width="500" height="500" fill="#f4f6f8" />

    <!-- top right half -->
    <g clip-path="url(#topRightHalf)">
        <!-- Sun Rays & Core -->
        <use href="#sunRays" fill="url(#indigoWash1)" />
        <circle cx="250" cy="250" r="110" fill="url(#centerGrad1)" />
        
        <!-- Inner decorative rings -->
        <circle cx="250" cy="250" r="130" fill="none" stroke="#8c9eff" stroke-width="2" opacity="0.6" stroke-dasharray="4 8" />
        
        <!-- Emanating perimeter lines (Dashed circles) -->
        <circle cx="250" cy="250" r="220" fill="none" stroke="url(#indigoWash1)" stroke-width="6" stroke-dasharray="12 18" />
        <circle cx="250" cy="250" r="240" fill="none" stroke="url(#indigoWash1)" stroke-width="3" stroke-dasharray="6 24" opacity="0.5" />
    </g>

    <!-- Bottom-left (Offset and shadowed) -->
    <g clip-path="url(#bottomLeftHalf)">
        <!-- Translating the bottom half down and right to create the slice -->
        <g transform="translate(15, 15)" filter="url(#shadow)">
            <!-- Sun Rays & Core -->
            <use href="#sunRays" fill="url(#indigoWash2)" />
            <circle cx="250" cy="250" r="110" fill="url(#centerGrad2)" />
            
            <!-- Inner decorative rings -->
            <circle cx="250" cy="250" r="130" fill="none" stroke="#536dfe" stroke-width="2" opacity="0.6" stroke-dasharray="4 8" />
            
            <!-- Emanating perimeter lines (Dashed circles) -->
            <circle cx="250" cy="250" r="220" fill="none" stroke="url(#indigoWash2)" stroke-width="6" stroke-dasharray="12 18" />
            <circle cx="250" cy="250" r="240" fill="none" stroke="url(#indigoWash2)" stroke-width="3" stroke-dasharray="6 24" opacity="0.5" />
        </g>
    </g>
</svg>