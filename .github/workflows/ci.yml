name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — fmt, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo test --workspace
        run: cargo test --workspace --all-features

      - name: cargo clippy (report only)
        # Not a gate yet. The workspace currently carries ~53 pre-existing
        # warnings. Visible in CI logs so new PRs can see what they're
        # adding to, without blocking merges until that backlog is cleared.
        # Flip to a hard failure (drop continue-on-error, add -D warnings)
        # once the backlog is worked down to zero.
        continue-on-error: true
        run: cargo clippy --workspace --all-targets

  frontend:
    name: Frontend — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          # `defaults.run.working-directory: frontend` above only affects
          # `run:` steps, not this action's own inputs — package.json/
          # packageManager live at frontend/package.json, not repo root,
          # so without this the action finds nothing to read a version
          # from and fails with "No pnpm version is specified."
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run lint

      - name: Build
        # Dummy values only — next.config.mjs hard-fails a production build
        # (which `next build` always is, regardless of the runner's own
        # NODE_ENV) if these are unset. This is a build/typecheck
        # verification, not a runtime smoke test, so they never need to
        # point at a real backend.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api
          NEXT_PUBLIC_WS_URL: ws://localhost:8080
        run: pnpm run build

  a11y:
    name: Accessibility (pre-auth routes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          # `defaults.run.working-directory: frontend` above only affects
          # `run:` steps, not this action's own inputs — package.json/
          # packageManager live at frontend/package.json, not repo root,
          # so without this the action finds nothing to read a version
          # from and fails with "No pnpm version is specified."
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox

      # msedge isn't installable via playwright's own --with-deps on a
      # GitHub-hosted runner; the project list in playwright.config.ts still
      # includes it for local runs. Scope CI to the two browsers actually
      # installed above.
      - run: pnpm exec playwright test --project=chromium --project=firefox

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
